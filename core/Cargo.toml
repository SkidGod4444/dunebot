[package]
name = "dunebot-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dirs = "7.0.0"
libc = "0.2.191"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.2", features = ["v4"] }

# Push-to-talk: microphone capture and on-device speech-to-text (whisper.cpp).
# Cross-builds without a C++ toolchain/ALSA: --no-default-features.
cpal = { version = "0.18", optional = true }
whisper-rs = { version = "0.16", optional = true }
# Sarvam voice (every build: reading aloud needs no microphone) and the speech model download.
ureq = "3"
# Sarvam's streaming text-to-speech (a WebSocket): audio starts while a sentence is still being made.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# Dictation on Linux reads the X11 keyboard state (libX11, loaded at run time: a desktop without X11 still runs).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[features]
default = ["voice"]
voice = ["dep:cpal", "dep:whisper-rs"]


# whisper.cpp is far too slow unoptimised, even in dev builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
[profile.dev.package.whisper-rs]
opt-level = 3
