[package]
name = "dunebot-wayland"
version = "0.1.0"
edition = "2024"
description = "Dune Bot's hand and eyes on a Wayland desktop (GNOME): the desktop's remote-control permission (one box, remembered), the screen from its video stream, clicks and keys through libei. Linux only; a separate program so the app and its addon never need these libraries."

[[bin]]
name = "dunebot-wayland"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
enumflags2 = "0.7"
pipewire = "0.10"
xkbcommon = "0.9"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
futures-util = "0.3"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
