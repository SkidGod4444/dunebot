# Throwaway: what a GNOME Wayland session lets an app do (screenshots, the remote-control portal).
name: wayland-spike
on:
  push:
    branches: [wayland-spike]
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: GNOME, the portal, PipeWire
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            gnome-shell mutter xdg-desktop-portal xdg-desktop-portal-gnome pipewire wireplumber python3-gi gir1.2-glib-2.0 \
            dbus dbus-daemon libglib2.0-bin libnss3 libasound2t64 libgbm1 libgl1-mesa-dri libegl-mesa0 fonts-dejavu-core
      - name: Electron
        run: mkdir -p /tmp/el && cd /tmp/el && bun add electron@45.3.2 >/dev/null && node node_modules/electron/install.js && ls node_modules/electron/dist | head -3
      - name: Spike
        run: bash spike/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-spike
          path: out/
