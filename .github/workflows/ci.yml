# The same checks on macOS, Windows and Linux: the core's tests, the core run end to end, the pages
# built, and every window drawn hidden in light and dark (pictures + measurements). The last job
# compares Windows and Linux against macOS: same parts, same places, same colours.
name: ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # Built C++ (whisper.cpp) remembers the compiler's full path, which changes with the runner image:
      # a cache from an older image fails to build, so each image keeps its own.
      - name: Runner image, for the build cache
        shell: bash
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUNNER_IMAGE }}
          workspaces: |
            core
            native
            wayland
      - name: Linux packages (sound for the mic, a virtual display for the windows, a keychain, the Wayland helper's build libraries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libatk-bridge2.0-0 libx11-6 libxtst6 \
            libpipewire-0.3-dev libxkbcommon-dev clang libclang-dev gnome-keyring dbus-x11
      - name: Windows, where bindgen finds clang (speech-to-text)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Core tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Core end to end
        run: |
          cargo build --manifest-path core/Cargo.toml
          PY=$(command -v python3 || command -v python)
          "$PY" -I scripts/core_smoke.py core/target/debug/dunebot-core "$(mktemp -d)"
          "$PY" -I scripts/core_location_turn.py core/target/debug/dunebot-core "$(mktemp -d)"
          "$PY" -I scripts/core_point_turn.py core/target/debug/dunebot-core "$(mktemp -d)"
      - name: Pages
        run: bunx tsc --noEmit -p . && bunx vite build
      - name: The answer card follows the pointer (never on it, always on the screen, no flapping at an edge)
        run: node scripts/check_follow.mjs
      - name: Mouse and keyboard steps for each system (a stand-in addon)
        run: node scripts/check_input.mjs
      - name: The teaching highlight (fake windows)
        run: node scripts/check_pointer.mjs
      # Dictation (Right ⌥ on macOS, Right Ctrl on Windows and Linux): words as if just said, a stand-in keyboard.
      - name: Dictation end to end (stand-ins)
        run: |
          node scripts/check_dictation.mjs
          node scripts/check_dictation_press.mjs
      - name: The mic starts before the voice keys are unlocked (a slow keychain loses nothing said)
        run: node scripts/check_voice_start.mjs
      # The Mac's self-check skips the keychain (a CI Mac would ask a person); Windows and Linux open a
      # locked key the way the app does. Linux: a desktop's secret store (GNOME's keyring, unlocked).
      - name: The voice keys come back from the system's keychain (the async unlock)
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && XDG_CURRENT_DESKTOP=GNOME xvfb-run -a node scripts/check_keychain.mjs'
          else node scripts/check_keychain.mjs; fi
      # The real pointer and keyboard of the runner's own screen. Not on the Mac runner: macOS needs
      # Accessibility switched on by a person, which a CI machine can't do.
      - name: The mouse and keyboard for real (clicks, typing, shortcuts, scrolling, a drag; dictation's key held)
        if: runner.os != 'macOS'
        run: |
          node scripts/native.mjs
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1440x900x24" node scripts/check_input_live.mjs
          else node scripts/check_input_live.mjs; fi
          # Dictation's key held for real: Right Ctrl pressed from outside the core, as a keyboard would.
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1440x900x24" node scripts/check_dictation_keys_live.mjs
          else node scripts/check_dictation_keys_live.mjs; fi
      - name: Replies render safely (every partial state, the reply tags, attacks in the real windows) and are spoken as plain words
        run: |
          bun scripts/check_reply.tsx
          bun scripts/check_speech.ts
          bun scripts/check_steps.ts
          bun scripts/check_store_events.ts
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1440x900x24" bun scripts/check_reply_live.ts
          else bun scripts/check_reply_live.ts; fi
      - name: Windows drawn hidden
        run: |
          # What main tells a page the moment it loads reaches it, though React listens a moment later.
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1440x900x24" node scripts/check_early_messages.mjs
          else node scripts/check_early_messages.mjs; fi
          # The audit (DUNEBOT_SNAPSHOT_AUDIT) measures every clickable on every page while it's drawn:
          # hand cursor, a name, reachable by keyboard, a visible focus, text contrast (WCAG AA 4.5:1),
          # nothing cut off or off the window. The gate below keeps each at zero.
          export DUNEBOT_SNAPSHOT_AUDIT=1
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1440x900x24" node scripts/snapshots.mjs snapshots
          else node scripts/snapshots.mjs snapshots; fi
          # The Mac also draws the Windows and Linux versions of the pages, the reference for those systems.
          if [ "$RUNNER_OS" = macOS ]; then node scripts/snapshots.mjs snapshots win32 && node scripts/snapshots.mjs snapshots linux; fi
          node scripts/audit.mjs snapshots --max cursor=0,name=0,keyboard=0,focus=0,contrast=0,clipped=0,offWindow=0
      - name: Packaged app (unpacked folder) checks itself and draws the same pages
        shell: bash
        run: |
          bun run package
          APP=$(node -e 'const p={darwin:"out/Dunebot-darwin-%s/Dunebot.app/Contents/MacOS/Dunebot",win32:"out/Dunebot-win32-%s/Dunebot.exe",linux:"out/Dunebot-linux-%s/dunebot"}[process.platform]; console.log(require("path").resolve(p.replace("%s",process.arch)))')
          if [ "$RUNNER_OS" = Linux ]; then
            DUNEBOT_SELFCHECK=1 xvfb-run -a "$APP" --no-sandbox
            DUNEBOT_SNAPSHOT_APP="$APP" xvfb-run -a -s "-screen 0 1440x900x24" node scripts/snapshots.mjs packaged
          else
            DUNEBOT_SELFCHECK=1 "$APP"
            DUNEBOT_SNAPSHOT_APP="$APP" node scripts/snapshots.mjs packaged
          fi
          python3 scripts/compare_snapshots.py snapshots "$(node -p process.platform)" packaged "$(node -p process.platform)" 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ runner.os }}
          path: snapshots/

  # Wayland (GNOME 46, Ubuntu 24.04): the helper that asks GNOME for the screen and the keyboard and
  # pointer, and the app's side of it (electron/wayland.mjs, input.mjs, gnome-keys.mjs), run against
  # GNOME's own shell, portal, PipeWire and media-keys service in a headless session. A virtual pointer
  # and keyboard made through GNOME's shell answer the box and press the shortcuts as a person would.
  wayland-gnome:
    # One screen; one at 200%; two side by side at 100% and 200% (the box then asks which to share).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: one-screen, monitors: "1280x800", scales: "" }
          - { name: hidpi, monitors: "2560x1600", scales: "2" }
          - { name: two-screens, monitors: "1280x800 2560x1600", scales: "1,2" }
    name: wayland-gnome (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wayland
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: wayland-gnome-debs-v3
          restore-keys: wayland-gnome-debs-
      # The azure mirror first and a time limit per try: the default mirror has stalled for 25 min.
      - name: GNOME, the portal, PipeWire (and the helper's build libraries)
        timeout-minutes: 14
        run: |
          printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          mkdir -p ~/apt-debs/partial
          sudo apt-get update -o Acquire::Retries=3
          for try in 1 2 3; do
            timeout 240 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              -o Dir::Cache::archives="$HOME/apt-debs" \
              libpipewire-0.3-dev libxkbcommon-dev clang libclang-dev pkg-config \
              gnome-shell mutter xdg-desktop-portal xdg-desktop-portal-gnome pipewire wireplumber python3-gi gir1.2-glib-2.0 \
              gir1.2-gtk-3.0 dbus dbus-daemon libglib2.0-bin libgl1-mesa-dri libegl-mesa0 fonts-dejavu-core \
              gnome-settings-daemon xwayland dconf-cli ibus at-spi2-core gir1.2-atspi-2.0 \
              libnss3 libasound2t64 libgbm1 libxss1 libxshmfence1 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 \
              libxcomposite1 libxdamage1 libxrandr2 libxtst6 && break
            echo "install try $try stalled or failed"
          done
          sudo chmod -R a+r ~/apt-debs
          dpkg -l gnome-shell mutter xdg-desktop-portal-gnome | tail -3
      - name: The helper, and Electron for the app side's own-window check
        run: |
          cargo build --release --manifest-path wayland/Cargo.toml
          bun install --frozen-lockfile
          # The binary itself (the package may otherwise fetch it only when first started through it).
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron
      - name: The box, the screen, clicks, typing, the token, a stop from GNOME's top bar; then the app's side (stop, idle, GNOME's shortcuts pressed)
        env:
          DUNEBOT_WL_MONITORS: ${{ matrix.monitors }}
          DUNEBOT_WL_SCALES: ${{ matrix.scales }}
        run: DUNEBOT_TEST_ELECTRON="$PWD/node_modules/electron/dist/electron" bash wayland/test/run.sh wayland/target/release/dunebot-wayland out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-gnome-${{ matrix.name }}
          path: out/

  wayland-fedora:
    # Fedora 43, GNOME 49 (Mutter's logical layout: a 200% screen is half as many points as pixels),
    # in a container. The same three layouts as wayland-gnome.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: one-screen, monitors: "1280x800", scales: "" }
          - { name: hidpi, monitors: "2560x1600", scales: "2" }
          - { name: two-screens, monitors: "1280x800 2560x1600", scales: "1,2" }
    name: wayland-fedora (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Electron for the app side's own-window check
        run: |
          bun install --frozen-lockfile
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron
      - name: GNOME 49 on Fedora 43 - the box, the screen, clicks, typing; then the app's side
        env:
          DUNEBOT_WL_MONITORS: ${{ matrix.monitors }}
          DUNEBOT_WL_SCALES: ${{ matrix.scales }}
        run: bash wayland/test/fedora.sh node_modules/electron/dist out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-fedora-${{ matrix.name }}
          path: out/

  same-everywhere:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shots
      - name: Windows and Linux draw their pages as the Mac draws them
        run: |
          python3 scripts/compare_snapshots.py shots/snapshots-macOS win32 shots/snapshots-Windows win32 6 bar,caption,caption-tags,caption-approval,setup,main,fixes,schedules,permissions
          python3 scripts/compare_snapshots.py shots/snapshots-macOS linux shots/snapshots-Linux linux 6 bar,caption,caption-tags,caption-approval,setup,main,fixes,schedules,permissions
      # 6 px: Windows/Linux scrollbars take room (macOS's float), which moves centred content 5 px.
      # Not Permissions: the Mac's has a Keys section (the ⌥⌘ tap-and-hold is Mac-only). Each system's
      # own Permissions page is checked against the Mac's drawing of it in the step above.
      - name: The bar and history window are the same page on every system
        run: |
          python3 scripts/compare_snapshots.py shots/snapshots-macOS darwin shots/snapshots-macOS win32 6 bar,caption,caption-tags,caption-approval,main,fixes,schedules
          python3 scripts/compare_snapshots.py shots/snapshots-macOS darwin shots/snapshots-macOS linux 6 bar,caption,caption-tags,caption-approval,main,fixes,schedules
