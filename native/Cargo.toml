[package]
name = "dunebot-native"
version = "0.1.0"
edition = "2024"
description = "Dunebot's addon. macOS: notification permission, window appearance, location, the mouse and keyboard (the glass comes from electron-liquid-glass). Windows and Linux: the mouse and keyboard."

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[build-dependencies]
napi-build = "2"

[profile.release]
